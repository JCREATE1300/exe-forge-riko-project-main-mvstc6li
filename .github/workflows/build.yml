name: Build Windows Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build executable
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pyinstaller --onefile --name riko-project-main riko_project-main/main.py

      - name: Build NSIS installer
        run: makensis installer.nsi

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: riko-project-main-Setup
          path: riko-project-main-Setup.exe

      - name: Create release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: riko-project-main-Setup.exe
          tag_name: v1.0.${{ github.run_number }}
          name: riko-project-main v1.0.${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
