<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riko</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
    #start {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font: 20px sans-serif; color: #444; background: rgba(255, 255, 255, 0.8); cursor: pointer;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.1/lib/three-vrm.module.min.js"
      }
    }
  </script>
</head>
<body>
  <div id="start">Loading...</div>
  <audio id="voice"></audio>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

    // ── Scene: white background ──
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);
    const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 20);
    const light = new THREE.DirectionalLight(0xffffff, Math.PI);
    light.position.set(1, 1, 1);
    scene.add(light);

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ── Load her ──
    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));
    const vrm = (await loader.loadAsync('avatar.vrm')).userData.vrm;  // set vrm_model in character_config.yaml
    VRMUtils.rotateVRM0(vrm);  // older VRM 0.x models face away without this
    scene.add(vrm.scene);

    // Arms down. VRM 0.x models are mirrored on this axis, so the angle flips.
    const arm = vrm.meta.metaVersion === '0' ? -1.3 : 1.3;
    vrm.humanoid.getNormalizedBoneNode('leftUpperArm').rotation.z = -arm;
    vrm.humanoid.getNormalizedBoneNode('rightUpperArm').rotation.z = arm;

    // ── Camera: framed by her head height, so short and tall models look the same.
    //    Drag to rotate, right-drag to move her, scroll to zoom. She glides a little after you let go. ──
    const headY = vrm.humanoid.getNormalizedBoneNode('head').getWorldPosition(new THREE.Vector3()).y;
    camera.position.set(0, headY * 0.94, headY * 1.37);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, headY * 0.9, 0);
    controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
    controls.minDistance = 0.5;
    controls.maxDistance = 5;
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;  // lower = longer glide

    // ── Lip sync: her mouth opens with the loudness of her voice ──
    const voice = document.getElementById('voice');
    const audioCtx = new AudioContext();
    const analyser = audioCtx.createAnalyser();
    audioCtx.createMediaElementSource(voice).connect(analyser);
    analyser.connect(audioCtx.destination);
    const samples = new Float32Array(analyser.fftSize);

    function loudness() {
      analyser.getFloatTimeDomainData(samples);
      let sum = 0;
      for (const s of samples) sum += s * s;
      return Math.sqrt(sum / samples.length);
    }

    // ── Ask Python for her next line, tell it when she is done ──
    voice.onended = voice.onerror = () => fetch('/done', { method: 'POST' });

    async function checkForVoice() {
      try {
        const { audio } = await (await fetch('/next')).json();
        if (audio) {
          voice.src = audio;
          await voice.play();
        }
      } catch { /* Python is not running; keep asking */ }
    }

    // Browsers only allow sound after a click, so wait for one.
    const start = document.getElementById('start');
    start.textContent = 'Click to start';
    start.onclick = () => {
      start.remove();
      audioCtx.resume();
      setInterval(checkForVoice, 250);
    };

    // ── Every frame ──
    const clock = new THREE.Clock();
    let mouth = 0;
    let loudest = 0.05;  // loudest recent level, so quiet and loud voices both move the mouth fully
    renderer.setAnimationLoop(() => {
      const level = loudness();
      loudest = Math.max(0.05, loudest * 0.995, level);
      mouth += (level / loudest - mouth) * 0.5;  // smoothed so it does not flicker
      vrm.expressionManager.setValue('aa', mouth);
      vrm.update(clock.getDelta());
      controls.update();  // runs the glide
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
